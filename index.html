<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Media Upload</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#fbf2f6,#f5f1fa);font:16px/1.5 system-ui;color:#302630}main{width:min(760px,100%);background:white;border:1px solid #eee2e9;border-radius:24px;padding:clamp(22px,5vw,44px);box-shadow:0 18px 60px #39203b12}.brand{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#a94f70;font-weight:800}h1{font-size:clamp(28px,5vw,40px);margin:10px 0;letter-spacing:-.04em}p,.small{color:#786f7b}.panel{border:1px solid #eee5eb;border-radius:16px;padding:20px;margin-top:22px}label{display:block;font-weight:650;margin-bottom:8px}input[type=password]{width:100%;padding:13px;border:1px solid #dcd0d9;border-radius:10px;font:inherit;margin-bottom:12px}button{border:0;background:#a94f70;color:white;font:inherit;font-weight:700;border-radius:10px;padding:12px 18px;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#f5edf2;color:#302630}.drop{border:2px dashed #d9c3d0;border-radius:15px;padding:30px 18px;text-align:center;background:#fdfafd;cursor:pointer}.drop.drag{background:#fcf1f6}input[type=file]{display:none}.files{display:grid;gap:10px;margin:16px 0}.file{display:flex;gap:12px;align-items:center;border:1px solid #eee5eb;padding:12px;border-radius:12px}.meta{flex:1;min-width:0}.filename{font-weight:650;overflow-wrap:anywhere}.small{font-size:12px}progress{width:100%;height:7px;accent-color:#a94f70}.status{font-size:13px;margin-top:4px}.ok{color:#26734d}.err{color:#b42318}.hidden{display:none!important}.actions{display:flex;gap:10px;flex-wrap:wrap}.notice{font-size:13px;background:#fbf5e8;border-radius:10px;padding:12px;color:#75591b;margin-top:16px}footer{font-size:12px;color:#786f7b;margin-top:24px}
</style></head><body><main><div class="brand">Private client portal</div><h1>Share your photos & videos</h1><p>Upload your media in one place. Select multiple files and track each upload.</p>
<section id="login" class="panel"><form id="loginForm"><label for="password">Shared access password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Enter the password provided to you"><button id="loginBtn">Unlock upload portal</button><p id="loginStatus" class="status" role="status"></p></form></section>
<section id="portal" class="panel hidden"><label>Select images and videos</label><label class="drop" id="drop"><input id="picker" type="file" multiple accept="image/*,video/*"><strong>＋ Choose files</strong><br><span class="small">or drag and drop here</span><br><span class="small">Images and videos · Up to 20 MB per file</span></label><div id="files" class="files"></div><div class="actions"><button id="uploadBtn" disabled>Upload selected files</button><button id="clearBtn" class="secondary" type="button">Clear selection</button></div><p id="uploadStatus" class="status" role="status"></p><div class="notice">Keep this page open until each file reports success.</div></section><footer>Private upload portal · Uploaded files go to the configured private storage repository.</footer></main>
<script>
const API_BASE="https://REPLACE-WITH-YOUR-UPLOAD-API";const $=id=>document.getElementById(id);let session="",selected=[];
const human=n=>n<1048576?Math.round(n/1024)+" KB":(n/1048576).toFixed(1)+" MB";
function status(id,msg,cls){const e=$(id);e.textContent=msg;e.className="status "+(cls||"")}
function render(){const box=$("files");box.innerHTML="";selected.forEach(f=>{const row=document.createElement("div");row.className="file";const icon=document.createElement("div");icon.textContent=f.type.startsWith("video/")?"🎬":"🖼️";const meta=document.createElement("div");meta.className="meta";const name=document.createElement("div");name.className="filename";name.textContent=f.name;const size=document.createElement("div");size.className="small";size.textContent=human(f.size);const prog=document.createElement("progress");prog.max=100;prog.value=f.progress||0;const st=document.createElement("div");st.className="status "+(f.error?"err":f.done?"ok":"");st.textContent=f.error||(f.done?"Uploaded successfully":f.busy?"Uploading…":"Ready");meta.append(name,size,prog,st);row.append(icon,meta);box.append(row)});$("uploadBtn").disabled=!selected.length||selected.some(f=>f.busy||!f.done&&!session)}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();if(API_BASE.includes("REPLACE-WITH")){status("loginStatus","Setup incomplete: deploy the secure upload API and configure its URL first.","err");return}const b=$("loginBtn");b.disabled=true;status("loginStatus","Checking password…");try{const r=await fetch(API_BASE+"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("password").value})});const d=await r.json();if(!r.ok)throw Error(d.error||"Incorrect password");session=d.token;$("login").classList.add("hidden");$("portal").classList.remove("hidden")}catch(err){status("loginStatus",err.message,"err")}finally{b.disabled=false}});
function addFiles(list){for(const f of list){if(!f.type.startsWith("image/")&&!f.type.startsWith("video/"))continue;if(f.size>20*1024*1024){status("uploadStatus",f.name+" exceeds the 20 MB limit.","err");continue}if(!selected.some(x=>x.name===f.name&&x.size===f.size&&x.lastModified===f.lastModified))selected.push(Object.assign(f,{progress:0,done:false,busy:false,error:""}))}render()}
$("picker").addEventListener("change",e=>addFiles(e.target.files));const drop=$("drop");drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("drag")});drop.addEventListener("dragleave",()=>drop.classList.remove("drag"));drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("drag");addFiles(e.dataTransfer.files)});$("clearBtn").addEventListener("click",()=>{selected=[];$("picker").value="";status("uploadStatus","","");render()});
$("uploadBtn").addEventListener("click",async()=>{for(const f of selected){if(f.done||f.busy)continue;f.busy=true;f.error="";render();try{const data=await new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=()=>reject(Error("Could not read file"));rd.readAsDataURL(f)});const r=await fetch(API_BASE+"/api/upload",{method:"POST",headers:{"Authorization":"Bearer "+session,"Content-Type":"application/json"},body:JSON.stringify({name:f.name,type:f.type,data:data.split(",")[1]})});const d=await r.json();if(!r.ok)throw Error(d.error||"Upload failed");f.done=true;f.progress=100}catch(e){f.error=e.message}finally{f.busy=false;render()}}const n=selected.filter(f=>f.error).length;status("uploadStatus",n?n+" file(s) failed; click upload to retry.":"All selected files have finished uploading.",n?"err":"ok")});render();
</script></body></html>
